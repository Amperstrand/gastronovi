name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Leak gate
        run: node scripts/leak-scan.mjs . --history
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
